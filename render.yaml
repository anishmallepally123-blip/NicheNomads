# Render blueprint: New > Blueprint, pick this repo. Builds the Dockerfile.
services:
  - type: web
    name: spherex-blink
    runtime: docker
    plan: starter            # free plan works too, but it sleeps and has no disk
    healthCheckPath: /api/health
    envVars:
      - key: SENTRY_DSN
        sync: false          # paste in the dashboard, optional
      - key: SPHEREX_CACHE_DIR
        value: /data/cache
    disk:
      name: spherex-cache
      mountPath: /data
      sizeGB: 5
