# Fly.io: `fly launch --no-deploy` (keep this file), then
#   fly volumes create spherex_cache --size 5
#   fly secrets set SENTRY_DSN=...        (optional)
#   fly deploy
app = "spherex-blink"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SPHEREX_CACHE_DIR = "/data/cache"

[[mounts]]
  source = "spherex_cache"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
